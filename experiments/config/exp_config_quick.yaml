experiment:
  id: exp_001_quick
  description: Quick test for pipeline
  author: test
  created: 2026-03-23
  random_seed: 42

onet_db_path: docs/data/master_careers_riasec_categories.csv

datasets:
  - name: quick_dataset
    train_path: docs/data/master_careers_riasec_categories.csv
    test_path: docs/data/Kaggle_Cleaned_Mapped_Categories.csv
    split: null
    shuffle: false

models:
  - model: logistic_regression
    parameters:
      max_iter: 100
      solver: lbfgs
      top_n_categories: 3
    x_features:
      - Realistic
      - Investigative
      - Artistic
      - Social
      - Enterprising
      - Conventional
    y_features:
      - Career Category

training:
  cross_validation_folds: 5
  normalize_features: true
  standardize_features: true
  parallel_jobs: 4

evaluation:
  metrics:
    - ndcg_at_k
    - precision_at_k
  k_values:
    - 5
  top_k: 5
  benchmark_runs: 1
  progress_log_interval: 1000
  max_test_samples: 3

output:
  directory: experiments/results/exp_001
  save_models: false
  save_predictions: false
  save_metrics: true

export:
  export_inference_model: false
  format: onnx
