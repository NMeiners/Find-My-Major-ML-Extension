# ============================================================
# Experiment Metadata
# ============================================================

experiment:
  id: exp_001
  description: Baseline model comparison using RIASEC features
  author: team_member
  created: YYYY-MM-DD
  random_seed: 42

# ============================================================
# Dataset Matrix
# Outer loop — each enabled dataset is run against every enabled model.
#
# Knobs:
#   enabled         — set false to skip this dataset without deleting it
#   train_path      — swap to try a completely different dataset
#   test_path       — separate held-out test set (omit to use split: below)
#   split           — train/val/test fractions when no test_path is given
#   shuffle         — randomize record order before splitting
# ============================================================

onet_db_path: docs/data/master_careers_riasec_categories.csv  # O*NET career database — used for job ranking

datasets:

  # Dataset 1 — O*NET as train, Kaggle as test
  - name: onet_kaggle
    enabled: true
    train_path: docs/data/master_careers_riasec_categories.csv
    test_path: docs/data/Kaggle_Cleaned_Mapped_Categories.csv
    split: null
    shuffle: false

  # Dataset 2 — Kaggle only, auto-split (uncomment train_path / set enabled: true to use)
  # - name: kaggle_split
  #   enabled: false
  #   train_path: docs/data/Kaggle_Cleaned_Mapped_Categories.csv
  #   test_path: null
  #   split:
  #     train: 0.70
  #     validation: 0.15
  #     test: 0.15
  #   shuffle: true


# ============================================================
# Model Matrix
# Inner loop — each enabled model is trained and evaluated on every enabled dataset.
#
# Knobs:
#   enabled         — set false to cut a model without deleting it
#   parameters      — tweak any sklearn hyperparameter here
#   x_features      — change which input features are used (RIASEC subsets, derived features, etc.)
#   y_features      — change the prediction target (must match a column in the dataset)
#   top_n_categories — number of career categories to shortlist before job ranking
# ============================================================

models:

  # Model 1 — Logistic Regression
  - model: logistic_regression
    enabled: true

    parameters:
      max_iter: 1000
      solver: lbfgs
      top_n_categories: 3

    x_features:
      - Realistic
      - Investigative
      - Artistic
      - Social
      - Enterprising
      - Conventional

    y_features:
      - Career Category

  # Model 2 — Random Forest
  - model: random_forest
    enabled: true

    parameters:
      n_estimators: 200
      max_depth: 10
      top_n_categories: 3

    x_features:
      - Realistic
      - Investigative
      - Artistic
      - Social
      - Enterprising
      - Conventional

    y_features:
      - Career Category

  # Model 3 — Gradient Boosting
  - model: gradient_boosting
    enabled: true

    parameters:
      n_estimators: 100
      learning_rate: 0.1
      top_n_categories: 3

    x_features:
      - Realistic
      - Investigative
      - Artistic
      - Social
      - Enterprising
      - Conventional

    y_features:
      - Career Category

  # Model 4 — Heuristic (cosine similarity baseline, no training)
  - model: heuristic
    enabled: true

    parameters:
      top_n_categories: 3  # unused by heuristic; kept for interface consistency

    x_features:
      - Realistic
      - Investigative
      - Artistic
      - Social
      - Enterprising
      - Conventional

    y_features:
      - Career Category

  # Model 5 — KNN
  - model: knn
    enabled: true

    parameters:
      n_neighbors: 5
      top_n_categories: 3

    x_features:
      - Realistic
      - Investigative
      - Artistic
      - Social
      - Enterprising
      - Conventional

    y_features:
      - Career Category

# ============================================================
# Training Configuration
# ============================================================

training:

  cross_validation_folds: 5
  normalize_features: true
  standardize_features: true
  parallel_jobs: 4

# ============================================================
# Evaluation
# ============================================================

evaluation:

  metrics:
    - ndcg_at_k
    - precision_at_k
  k_values:
    - 5
  benchmark_runs: 1
  progress_log_interval: 1000
  top_k: 5
  max_test_samples: null

# ============================================================
# Output
# ============================================================

output:

  directory: experiments/results/exp_001

  save_models: true
  save_predictions: true
  save_metrics: true

# ============================================================
# Export
# ============================================================

export:

  export_inference_model: true
  format: onnx

# ============================================================
# Notes
# ============================================================

notes: |
  Baseline comparison of classical ML models using RIASEC features.
