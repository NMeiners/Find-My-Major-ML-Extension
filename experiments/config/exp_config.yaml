# ============================================================
# Experiment Metadata
# ============================================================

experiment:
  id: exp_001
  description: Baseline model comparison using RIASEC features
  author: team_member
  created: YYYY-MM-DD
  random_seed: 42

# ============================================================
# Dataset Matrix
# Each row = one dataset configuration
# ============================================================

onet_db_path: docs/data/master_careers_riasec_categories.csv  # O*NET career database — used for training AND job ranking

datasets:

  # Row 1 — O*NET as train, Kaggle as test
  - name: onet_kaggle
    train_path: docs/data/master_careers_riasec_categories.csv
    test_path: docs/data/Kaggle_Cleaned_Mapped_Categories.csv

    split: null
    shuffle: false


# ============================================================
# Model Matrix (17-Iteration Mega Grid Search)
# ============================================================

models:

  # --- THE REALITY CHECK ---
  - model: heuristic
    parameters:
      top_n_categories: 3
    x_features: ["Realistic", "Investigative", "Artistic", "Social", "Enterprising", "Conventional"]
    y_features: ["Career Category"]

  # --- LOGISTIC REGRESSION (Tuning Regularization) ---
  - model: logistic_regression
    parameters:
      C: 0.01 # Very strong regularization
      max_iter: 1000
      top_n_categories: 3
    x_features: ["Realistic", "Investigative", "Artistic", "Social", "Enterprising", "Conventional"]
    y_features: ["Career Category"]
  - model: logistic_regression
    parameters:
      C: 0.1 # Strong regularization
      max_iter: 1000
      top_n_categories: 3
    x_features: ["Realistic", "Investigative", "Artistic", "Social", "Enterprising", "Conventional"]
    y_features: ["Career Category"]
  - model: logistic_regression
    parameters:
      C: 1.0 # Standard regularization
      max_iter: 1000
      top_n_categories: 3
    x_features: ["Realistic", "Investigative", "Artistic", "Social", "Enterprising", "Conventional"]
    y_features: ["Career Category"]
  - model: logistic_regression
    parameters:
      C: 10.0 # Weak regularization
      max_iter: 1000
      top_n_categories: 3
    x_features: ["Realistic", "Investigative", "Artistic", "Social", "Enterprising", "Conventional"]
    y_features: ["Career Category"]

  # --- K-NEAREST NEIGHBORS (Tuning Neighborhoods) ---
  - model: knn
    parameters:
      n_neighbors: 5
      weights: uniform
      top_n_categories: 3
    x_features: ["Realistic", "Investigative", "Artistic", "Social", "Enterprising", "Conventional"]
    y_features: ["Career Category"]
  - model: knn
    parameters:
      n_neighbors: 15
      weights: distance
      top_n_categories: 3
    x_features: ["Realistic", "Investigative", "Artistic", "Social", "Enterprising", "Conventional"]
    y_features: ["Career Category"]
  - model: knn
    parameters:
      n_neighbors: 30
      weights: uniform
      top_n_categories: 3
    x_features: ["Realistic", "Investigative", "Artistic", "Social", "Enterprising", "Conventional"]
    y_features: ["Career Category"]
  - model: knn
    parameters:
      n_neighbors: 50
      weights: distance
      top_n_categories: 3
    x_features: ["Realistic", "Investigative", "Artistic", "Social", "Enterprising", "Conventional"]
    y_features: ["Career Category"]

  # --- RANDOM FOREST (Tuning Tree Complexity) ---
  - model: random_forest
    parameters:
      n_estimators: 100
      max_depth: 5
      min_samples_split: 10
      top_n_categories: 3
    x_features: ["Realistic", "Investigative", "Artistic", "Social", "Enterprising", "Conventional"]
    y_features: ["Career Category"]
  - model: random_forest
    parameters:
      n_estimators: 300
      max_depth: 5
      min_samples_split: 5
      top_n_categories: 3
    x_features: ["Realistic", "Investigative", "Artistic", "Social", "Enterprising", "Conventional"]
    y_features: ["Career Category"]
  - model: random_forest
    parameters:
      n_estimators: 200
      max_depth: 10
      min_samples_split: 5
      top_n_categories: 3
    x_features: ["Realistic", "Investigative", "Artistic", "Social", "Enterprising", "Conventional"]
    y_features: ["Career Category"]
  - model: random_forest
    parameters:
      n_estimators: 500
      max_depth: 15
      min_samples_split: 2
      top_n_categories: 3
    x_features: ["Realistic", "Investigative", "Artistic", "Social", "Enterprising", "Conventional"]
    y_features: ["Career Category"]

  # --- GRADIENT BOOSTING (Tuning Aggression) ---
  - model: gradient_boosting
    parameters:
      n_estimators: 100
      learning_rate: 0.2
      max_depth: 2
      top_n_categories: 3
    x_features: ["Realistic", "Investigative", "Artistic", "Social", "Enterprising", "Conventional"]
    y_features: ["Career Category"]
  - model: gradient_boosting
    parameters:
      n_estimators: 300
      learning_rate: 0.05
      max_depth: 3
      top_n_categories: 3
    x_features: ["Realistic", "Investigative", "Artistic", "Social", "Enterprising", "Conventional"]
    y_features: ["Career Category"]
  - model: gradient_boosting
    parameters:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 5
      top_n_categories: 3
    x_features: ["Realistic", "Investigative", "Artistic", "Social", "Enterprising", "Conventional"]
    y_features: ["Career Category"]
  - model: gradient_boosting
    parameters:
      n_estimators: 200
      learning_rate: 0.01
      max_depth: 7
      top_n_categories: 3
    x_features: ["Realistic", "Investigative", "Artistic", "Social", "Enterprising", "Conventional"]
    y_features: ["Career Category"]

# ============================================================
# Training Configuration
# ============================================================

training:

  cross_validation_folds: 5
  normalize_features: true
  standardize_features: true
  parallel_jobs: 4

# ============================================================
# Evaluation
# ============================================================

evaluation:

  metrics:
    - ndcg_at_k
    - precision_at_k
    - recall_at_k  # Add recall_at_k to the list of metrics
  k_values:
    - 5
  benchmark_runs: 1
  progress_log_interval: 1000
  top_k: 5
  max_test_samples: 5000  # <--- Fast tuning mode

# ============================================================
# Output
# ============================================================

output:

  directory: experiments/results/exp_001

  save_models: true
  save_predictions: true
  save_metrics: true

# ============================================================
# Export
# ============================================================

export:

  export_inference_model: true
  format: onnx

# ============================================================
# Notes
# ============================================================

notes: |
  Baseline