# ============================================================
# Experiment Metadata
# ============================================================

experiment:
  id: exp_001
  description: Baseline model comparison using RIASEC features
  author: team_member
  created: YYYY-MM-DD
  random_seed: 42

# ============================================================
# Dataset Matrix
# Each row = one dataset configuration
# ============================================================

onet_db_path: docs/data/master_careers_riasec_categories.csv

datasets:

  # Row 1
  - name: riasec_single_dataset
    train_path: docs/data/master_careers_riasec_categories.csv
    test_path: null

    split:
      train: 0.70
      validation: 0.15
      test: 0.15

    shuffle: true

  # Row 2
  - name: kaggle_train_test
    train_path: docs/data/master_careers_riasec_categories.csv
    test_path: docs/data/Kaggle_Cleaned_Mapped_Categories.csv

    split: null
    shuffle: false


# ============================================================
# Model Matrix
# Each row = one model training configuration
# ============================================================

models:

  # Row 1
  - model: logistic_regression

    parameters:
      max_iter: 1000
      solver: lbfgs
      top_n_categories: 3

    x_features:
      - Realistic
      - Investigative
      - Artistic
      - Social
      - Enterprising
      - Conventional

    y_features:
      - Career Category

  # Row 2
  - model: random_forest

    parameters:
      n_estimators: 200
      max_depth: 10
      top_n_categories: 3

    x_features:
      - Realistic
      - Investigative
      - Artistic
      - Social
      - Enterprising
      - Conventional

    y_features:
      - Career Category

  # Row 3
  - model: gradient_boosting

    parameters:
      n_estimators: 100
      learning_rate: 0.1
      top_n_categories: 3

    x_features:
      - Realistic
      - Investigative
      - Artistic
      - Social
      - Enterprising
      - Conventional

    y_features:
      - Career Category

# ============================================================
# Training Configuration
# ============================================================

training:

  cross_validation_folds: 5
  normalize_features: true
  standardize_features: true
  parallel_jobs: 4

# ============================================================
# Evaluation
# ============================================================

evaluation:

  metrics:
    - ndcg_at_k       # supported metric family
    - precision_at_k  # supported metric family
  k_values:
    - 5
    # Each k must be <= top_k
  benchmark_runs: 1
  max_test_samples: null
  progress_log_interval: 1000
  top_k: 5  # used by model recommendation output size

# ============================================================
# Output
# ============================================================

output:

  directory: experiments/results/exp_001

  save_models: true
  save_predictions: true
  save_metrics: true

# ============================================================
# Export
# ============================================================

export:

  export_inference_model: true
  format: onnx

# ============================================================
# Notes
# ============================================================

notes: |
  Baseline comparison of classical ML models using RIASEC features.
